name: 每日自动更新应用源

# 触发条件
on:
  schedule:
    # GitHub cron 使用 UTC：22:30 UTC = 次日 06:30 北京时间
    - cron: '30 22 * * *'
  workflow_dispatch: # 支持手动点击运行

permissions:
  contents: write

# 定时任务和手动触发排队执行，避免两次运行互相抢着推送
concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 3. 安装依赖包
        run: pip install -r requirements.txt

      - name: 4. 运行爬虫脚本
        # 有来源抓取失败时脚本返回非 0，任务变红提醒，index.html 保持上一次结果
        run: python update_source.py --write

      - name: 5. 提交并推送更新
        run: |
          # 机器人身份配置
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # 只有当 index.html 确实被修改时才提交
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: 同步应用最新版本" && git push)
