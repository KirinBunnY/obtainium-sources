name: 每日自动更新应用源

# 触发条件
on:
  schedule:
    # GitHub cron 使用 UTC：22:30 UTC = 次日 06:30 北京时间
    - cron: '30 22 * * *'
  workflow_dispatch: # 支持手动点击运行

permissions:
  contents: write

# 定时任务和手动触发排队执行，避免两次运行互相抢着推送
concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 3. 安装依赖包
        run: pip install -r requirements.txt

      - name: 4. 运行爬虫脚本
        id: scrape
        # 退出码：0 全部成功；1 有来源降级但页面已用上次成功值补齐；2 无法生成页面
        # 用 set +e 记录退出码，先让页面尽量发布出去，最后再由任务状态体现失败
        run: |
          set +e
          python update_source.py --write
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code"

      - name: 5. 提交并推送更新
        # 即使有来源降级也要推送：页面已经是「新旧混合」的最佳结果
        run: |
          set -euo pipefail
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git add index.html sources-last-good.json
          if git diff --cached --quiet; then
            echo "index.html 无变化，跳过提交"
            exit 0
          fi
          git commit -m "Auto-update: 同步应用最新版本"
          git push

      - name: 6. 生成运行摘要
        # 无论成败都执行：让「哪个来源坏了」在任务页面上直接可见
        if: always()
        run: |
          cat > /tmp/summary.py <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          source = Path("sources-status.json")
          lines = ["## 应用源同步", ""]

          try:
              data = json.loads(source.read_text(encoding="utf-8"))
          except Exception as error:  # 脚本可能在写出快照前就失败了
              lines.append(f"未能读取 {source}：{error}")
          else:
              sources = data.get("sources", [])
              broken = [s for s in sources if not s.get("ok")]
              stale = [s for s in sources if s.get("ok") and s.get("stale")]

              if not broken:
                  lines.append(f"全部 {len(sources)} 个来源抓取成功。")
              else:
                  if data.get("published"):
                      lines.append(f"页面已发布，其中 {len(stale)} 个来源沿用上次成功值。")
                  else:
                      lines.append("页面未更新：没有可用来源，也没有可沿用的历史值。")
                  lines.append("")
                  lines.append("| 来源 | 情况 |")
                  lines.append("| --- | --- |")
                  for item in broken:
                      message = str(item.get("message", "")).replace("|", "\\|")
                      lines.append(f"| {item.get('name')} | {message} |")

          lines.append("")
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
          PY
          python /tmp/summary.py

          code="${{ steps.scrape.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "::warning::本次有来源抓取失败（退出码 $code），详情见上方摘要"
            exit 1
          fi
