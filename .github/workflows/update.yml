name: 每日自动更新应用源

# 触发条件
on:
  schedule:
    # 每天北京时间早上 8 点运行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖包
        run: |
          python -m pip install --upgrade pip
          # 移除了 cloudscraper 和 curl_cffi，只保留基础的 requests
          pip install requests

      - name: 4. 运行爬虫脚本
        run: python update_source.py

      - name: 5. 提交并推送更新
        run: |
          # 机器人身份配置
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 只有当 index.html 确实被修改时才提交
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: 同步应用最新版本" && git push)