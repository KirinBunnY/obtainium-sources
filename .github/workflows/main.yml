name: Update Miyoushe Source

on:
  schedule:
    # 每天 UTC 时间凌晨 2:00 运行（对应北京时间上午 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击运行测试

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行爬虫脚本
        run: python update_source.py

      - name: 提交并推送到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html
          # 如果内容有更新才提交，防止报错
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Miyoushe version" && git push)
